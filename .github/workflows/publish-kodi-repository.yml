name: Publish Kodi Repository

on:
  push:
    tags:
      - kodi-repo-*
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate publish ref
        run: |
          python - <<'PY'
          import os
          from scripts.build_kodi_repository import validate_publish_ref

          validate_publish_ref(os.environ["GITHUB_EVENT_NAME"], os.environ["GITHUB_REF"])
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt

      - name: Run existing Python test suite
        run: python -m pytest --ignore=tests/test_build_kodi_repository.py

      - name: Run repository build tests
        run: python -m pytest tests/test_build_kodi_repository.py

      - name: Build Kodi repository
        run: python scripts/build_kodi_repository.py --output build/kodi-repository

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/kodi-repository

  deploy:
    name: Deploy Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
